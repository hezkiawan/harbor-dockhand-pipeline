name: Kouventa CI to Harbor & Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Configure the GitHub Actions runner daemon to allow insecure HTTP
      - name: Configure Insecure Registry on Runner
        run: |
          sudo bash -c 'cat <<EOF > /etc/docker/daemon.json
          {
            "insecure-registries": ["${{ secrets.HARBOR_HOST }}"]
          }
          EOF'
          sudo systemctl restart docker

      # 2. Configure Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ secrets.HARBOR_HOST }}"]
              http = true
              insecure = true

      # 3. Log in to Harbor
      - name: Log in to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_ROBOT_USER }}
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}

      # 4. Build & Push Backend Image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_HOST }}/kouventa/backend:${{ github.sha }}
            ${{ secrets.HARBOR_HOST }}/kouventa/backend:latest

      # 5. Build & Push Frontend Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_HOST }}/kouventa/frontend:${{ github.sha }}
            ${{ secrets.HARBOR_HOST }}/kouventa/frontend:latest

  trigger-dockhand-deploy:
    name: Trigger Dockhand Redeployment
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch Redeploy to Dockhand
        run: |
          echo "Triggering redeployment of kouventa-app on environment ${{ secrets.DOCKHAND_ENV_ID }}..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "${{ secrets.DOCKHAND_SERVER_URL }}/api/stacks/kouventa-app/deploy?env=${{ secrets.DOCKHAND_ENV_ID }}" \
            -H "Authorization: Bearer ${{ secrets.DOCKHAND_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"pull": true, "recreate": true}')
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 204 ]; then
            echo "Deployment trigger failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Redeployment successfully triggered."