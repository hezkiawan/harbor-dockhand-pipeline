name: Kouventa CI to Harbor

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Configure the GitHub Actions runner daemon to allow insecure HTTP
      - name: Configure Insecure Registry on Runner
        run: |
          sudo bash -c 'cat <<EOF > /etc/docker/daemon.json
          {
            "insecure-registries": ["${{ secrets.HARBOR_HOST }}"]
          }
          EOF'
          sudo systemctl restart docker

      # 2. Configure Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ secrets.HARBOR_HOST }}"]
              http = true
              insecure = true

      # 3. Log in to Harbor
      - name: Log in to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_ROBOT_USER }}
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}

      # 4. Build & Push Backend Image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_HOST }}/kouventa/backend:${{ github.sha }}
            ${{ secrets.HARBOR_HOST }}/kouventa/backend:latest

      # 5. Build & Push Frontend Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_HOST }}/kouventa/frontend:${{ github.sha }}
            ${{ secrets.HARBOR_HOST }}/kouventa/frontend:latest